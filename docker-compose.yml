services:
  bosun:
    build: .
    container_name: bosun
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - path: .env
        required: false
    environment:
      - NTFY_URL=http://127.0.0.1:8888
      - NTFY_TOPIC=vela
      - NTFY_MAX_PRIORITY=default
      - POLL_INTERVAL=30
      - COOLDOWN=300
      - TAIL_LINES=0
      - PATTERNS=error|high|Error,exception|high|Exception,fatal|urgent|Fatal,panic|urgent|Panic,out of memory|urgent|OOM,killed|high|Killed,segfault|urgent|Segfault
